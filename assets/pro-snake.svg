<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-label="Animated GitHub contribution snake with multiple food cells">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="snakeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset=".48" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="food" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="1" stop-color="#0e4429"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="foodGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="15" height="15" rx="4" fill="#151d2c"/>
    </pattern>
    <clipPath id="clip"><rect x="34" y="70" width="1032" height="170" rx="16"/></clipPath>
    <path id="snakePath" d="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132"/>
  </defs>

  <rect width="1100" height="310" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="308" rx="23" fill="none" stroke="#27324a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="38" y="36" fill="#f1f5ff" font-size="20" font-weight="700">🐍 CONTRIBUTION SNAKE</text>
    <text x="38" y="54" fill="#7f8ca5" font-size="11">multiple contribution cells spawn across the grid — the snake hunts them down</text>
    <text x="1062" y="37" text-anchor="end" fill="#566680" font-size="10">KEREM BERK</text>
  </g>

  <rect x="34" y="70" width="1032" height="170" rx="16" fill="#090f19" stroke="#1f2c44"/>
  <rect x="34" y="70" width="1032" height="170" rx="16" fill="url(#grid)" opacity=".96"/>

  <g clip-path="url(#clip)">
    <!-- contribution cells: fixed grid with intentionally sparse activity -->
    <g opacity=".95">
      <g fill="#0e4429">
        <rect x="75" y="83" width="15" height="15" rx="4"/><rect x="141" y="127" width="15" height="15" rx="4"/>
        <rect x="207" y="171" width="15" height="15" rx="4"/><rect x="273" y="105" width="15" height="15" rx="4"/>
        <rect x="361" y="193" width="15" height="15" rx="4"/><rect x="449" y="127" width="15" height="15" rx="4"/>
        <rect x="515" y="83" width="15" height="15" rx="4"/><rect x="603" y="171" width="15" height="15" rx="4"/>
        <rect x="691" y="105" width="15" height="15" rx="4"/><rect x="779" y="193" width="15" height="15" rx="4"/>
        <rect x="867" y="127" width="15" height="15" rx="4"/><rect x="955" y="83" width="15" height="15" rx="4"/>
      </g>
      <g fill="#26a641" opacity=".85">
        <rect x="97" y="105" width="15" height="15" rx="4"/><rect x="163" y="171" width="15" height="15" rx="4"/>
        <rect x="295" y="171" width="15" height="15" rx="4"/><rect x="383" y="105" width="15" height="15" rx="4"/>
        <rect x="471" y="193" width="15" height="15" rx="4"/><rect x="559" y="105" width="15" height="15" rx="4"/>
        <rect x="625" y="83" width="15" height="15" rx="4"/><rect x="713" y="171" width="15" height="15" rx="4"/>
        <rect x="823" y="105" width="15" height="15" rx="4"/><rect x="911" y="193" width="15" height="15" rx="4"/>
        <rect x="999" y="149" width="15" height="15" rx="4"/>
      </g>
      <g fill="#39d353">
        <rect x="119" y="149" width="15" height="15" rx="4"/><rect x="339" y="83" width="15" height="15" rx="4"/>
        <rect x="537" y="171" width="15" height="15" rx="4"/><rect x="757" y="83" width="15" height="15" rx="4"/>
        <rect x="933" y="149" width="15" height="15" rx="4"/>
      </g>
    </g>

    <!-- multiple "food" cells; each disappears when the head reaches its waypoint, then respawns elsewhere -->
    <g filter="url(#foodGlow)">
      <g>
        <rect x="119" y="149" width="15" height="15" rx="4" fill="url(#food)">
          <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.08;.33;.37;.55;.6" dur="8s" repeatCount="indefinite"/>
        </rect>
        <circle cx="126.5" cy="156.5" r="1.8" fill="#d8ffe2"><animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.08;.33;.37;.55;.6" dur="8s" repeatCount="indefinite"/></circle>
      </g>
      <g>
        <rect x="339" y="83" width="15" height="15" rx="4" fill="url(#food)">
          <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.18;.48;.52;.73;.78" dur="8s" begin="-.9s" repeatCount="indefinite"/>
        </rect>
        <circle cx="346.5" cy="90.5" r="1.8" fill="#d8ffe2"><animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.18;.48;.52;.73;.78" dur="8s" begin="-.9s" repeatCount="indefinite"/></circle>
      </g>
      <g>
        <rect x="537" y="171" width="15" height="15" rx="4" fill="url(#food)">
          <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.27;.62;.66;.86;.91" dur="8s" begin="-1.8s" repeatCount="indefinite"/>
        </rect>
        <circle cx="544.5" cy="178.5" r="1.8" fill="#d8ffe2"><animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.27;.62;.66;.86;.91" dur="8s" begin="-1.8s" repeatCount="indefinite"/></circle>
      </g>
      <g>
        <rect x="757" y="83" width="15" height="15" rx="4" fill="url(#food)">
          <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.36;.72;.76;.94;1" dur="8s" begin="-2.7s" repeatCount="indefinite"/>
        </rect>
        <circle cx="764.5" cy="90.5" r="1.8" fill="#d8ffe2"><animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.36;.72;.76;.94;1" dur="8s" begin="-2.7s" repeatCount="indefinite"/></circle>
      </g>
      <g>
        <rect x="933" y="149" width="15" height="15" rx="4" fill="url(#food)">
          <animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.45;.82;.86;.98;1" dur="8s" begin="-3.6s" repeatCount="indefinite"/>
        </rect>
        <circle cx="940.5" cy="156.5" r="1.8" fill="#d8ffe2"><animate attributeName="opacity" values="0;1;1;0;0;1" keyTimes="0;.45;.82;.86;.98;1" dur="8s" begin="-3.6s" repeatCount="indefinite"/></circle>
      </g>
    </g>

    <!-- subtle trail -->
    <use href="#snakePath" fill="none" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="16" filter="url(#glow)"/>
    <use href="#snakePath" fill="none" stroke="url(#snakeGlow)" stroke-opacity=".35" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="1.2s" repeatCount="indefinite"/>
    </use>

    <!-- moving body segments: staggered along the same path gives real snake motion -->
    <g fill="url(#snakeGlow)" filter="url(#glow)">
      <circle r="10" opacity=".95"><animateMotion dur="8s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/></circle>
      <circle r="9" opacity=".88"><animateMotion dur="8s" begin="-.20s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/></circle>
      <circle r="9" opacity=".80"><animateMotion dur="8s" begin="-.40s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/></circle>
      <circle r="8" opacity=".72"><animateMotion dur="8s" begin="-.60s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/></circle>
      <circle r="8" opacity=".64"><animateMotion dur="8s" begin="-.80s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/></circle>
      <circle r="7" opacity=".55"><animateMotion dur="8s" begin="-1s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/></circle>
    </g>

    <!-- head -->
    <g filter="url(#glow)">
      <circle r="13" fill="#0b1120" stroke="url(#snakeGlow)" stroke-width="3"/>
      <circle cx="-4" cy="-4" r="2.5" fill="#eaf7ff"/>
      <circle cx="4" cy="-4" r="2.5" fill="#eaf7ff"/>
      <circle cx="-4" cy="-4" r="1" fill="#7dd3fc"/>
      <circle cx="4" cy="-4" r="1" fill="#ec4899"/>
      <path d="M-4 5 Q0 8 4 5" fill="none" stroke="#dfe9ff" stroke-width="1.3" stroke-linecap="round"/>
      <animateMotion dur="8s" repeatCount="indefinite" path="M90 150 C135 92 185 92 228 146 S330 210 386 152 S486 86 546 142 S650 207 712 147 S812 91 870 148 S972 210 1030 132" rotate="auto"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="34" y="257" width="1032" height="26" rx="9" fill="#090f19" stroke="#1f2c44"/>
    <circle cx="50" cy="270" r="4" fill="#39d353"/><text x="62" y="274" fill="#7f8ca5" font-size="10">FOOD CELLS</text>
    <circle cx="142" cy="270" r="4" fill="#8b5cf6"/><text x="154" y="274" fill="#7f8ca5" font-size="10">SNAKE</text>
    <text x="1049" y="274" text-anchor="end" fill="#566680" font-size="10">BUILD • LEARN • SHIP</text>
  </g>
</svg>