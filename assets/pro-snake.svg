<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-label="Professional animated contribution snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.5" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74f7ff"/>
      <stop offset="0.45" stop-color="#8c7bff"/>
      <stop offset="1" stop-color="#ff67cf"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74f7ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8c7bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff67cf" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="14" height="14" rx="4" fill="#151d30"/>
    </pattern>
    <clipPath id="clip"><rect x="34" y="66" width="1032" height="170" rx="16"/></clipPath>
  </defs>

  <rect width="1100" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="298" rx="23" fill="none" stroke="#26324b"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="38" y="35" fill="#eef3ff" font-size="20" font-weight="700">SNAKE // CONTRIBUTION TRACE</text>
    <text x="38" y="53" fill="#7d8aa5" font-size="11">a cleaner, technical take on the classic contribution animation</text>
    <text x="1062" y="36" text-anchor="end" fill="#596884" font-size="10">LIVE VISUAL</text>
  </g>

  <rect x="34" y="66" width="1032" height="170" rx="16" fill="#090f1a" stroke="#1f2b43"/>
  <rect x="34" y="66" width="1032" height="170" rx="16" fill="url(#grid)" opacity=".82"/>

  <g clip-path="url(#clip)">
    <path d="M-80 166 C30 86 116 84 218 154 S402 248 520 145 S733 64 832 148 S1000 232 1180 120"
          fill="none" stroke="#68dfff" stroke-width="16" opacity=".08" filter="url(#softGlow)"/>
    <path d="M-80 166 C30 86 116 84 218 154 S402 248 520 145 S733 64 832 148 S1000 232 1180 120"
          fill="none" stroke="url(#trail)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <g id="snake">
      <g filter="url(#glow)" opacity=".95">
        <path d="M-44 166 C30 86 116 84 218 154 S402 248 520 145 S733 64 832 148 S1000 232 1180 120"
              fill="none" stroke="url(#snake)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="62 24">
          <animate attributeName="stroke-dashoffset" from="0" to="-86" dur="1.65s" repeatCount="indefinite"/>
        </path>
      </g>

      <g>
        <path d="M-44 166 C30 86 116 84 218 154 S402 248 520 145 S733 64 832 148 S1000 232 1180 120"
              fill="none" stroke="#dfe8ff" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="54 28">
          <animate attributeName="stroke-dashoffset" from="0" to="-82" dur="1.65s" repeatCount="indefinite"/>
        </path>
        <path d="M-44 166 C30 86 116 84 218 154 S402 248 520 145 S733 64 832 148 S1000 232 1180 120"
              fill="none" stroke="url(#snake)" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="54 28">
          <animate attributeName="stroke-dashoffset" from="0" to="-82" dur="1.65s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g filter="url(#glow)">
      <g transform="translate(0,-1)">
        <circle r="11" fill="#0b1120" stroke="url(#snake)" stroke-width="3"/>
        <circle cx="4" cy="-3" r="2.8" fill="#ffffff"/>
        <circle cx="-4" cy="-3" r="2.8" fill="#ffffff"/>
        <circle cx="4.7" cy="-3" r="1.2" fill="#ff5a8a"/>
        <circle cx="-3.3" cy="-3" r="1.2" fill="#74f7ff"/>
        <path d="M-3 5 Q0 8 3 5" fill="none" stroke="#eaf1ff" stroke-width="1.4" stroke-linecap="round"/>
        <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto"
          path="M-80 166 C30 86 116 84 218 154 S402 248 520 145 S733 64 832 148 S1000 232 1180 120"/>
      </g>
    </g>

    <g fill="#ffffff" opacity=".55">
      <circle cx="140" cy="110" r="1.2"><animate attributeName="opacity" values=".15;.8;.15" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="365" cy="210" r="1.4"><animate attributeName="opacity" values=".1;.7;.1" dur="2.7s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="705" cy="100" r="1.3"><animate attributeName="opacity" values=".1;.85;.1" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="198" r="1.2"><animate attributeName="opacity" values=".15;.75;.15" dur="2.9s" begin="1.6s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="38" y="260" fill="#64728f" font-size="10">BUILD</text>
    <text x="88" y="260" fill="#64728f" font-size="10">LEARN</text>
    <text x="148" y="260" fill="#64728f" font-size="10">SHIP</text>
    <text x="1062" y="260" text-anchor="end" fill="#465671" font-size="10">KEREM BERK · 2026</text>
  </g>
</svg>