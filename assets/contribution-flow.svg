<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 270" role="img" aria-label="Animated contribution activity visualization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10182a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="0.45" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="12" height="12" rx="3" fill="#182235"/>
    </pattern>
    <clipPath id="matrixClip">
      <rect x="38" y="70" width="1024" height="126" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1100" height="270" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1098" height="268" rx="21" fill="none" stroke="#27324a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="38" fill="#e8eefc" font-size="20" font-weight="700">CONTRIBUTION FLOW</text>
    <text x="40" y="56" fill="#7f8ca8" font-size="11">a small visual signature for continuous building &amp; shipping</text>
    <text x="1060" y="39" text-anchor="end" fill="#687895" font-size="10">KEREM BERK</text>
  </g>

  <rect x="38" y="70" width="1024" height="126" rx="12" fill="#0a101c" stroke="#1c2940"/>
  <rect x="38" y="70" width="1024" height="126" rx="12" fill="url(#grid)" opacity=".72"/>

  <g clip-path="url(#matrixClip)">
    <g opacity=".18" stroke="#6ee7ff">
      <path d="M48 88H1052M48 124H1052M48 160H1052M48 196H1052" stroke-width="1"/>
    </g>

    <g fill="url(#line)" opacity=".9">
      <rect x="110" y="88" width="12" height="12" rx="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="290" y="124" width="12" height="12" rx="3"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" begin=".4s" repeatCount="indefinite"/></rect>
      <rect x="470" y="160" width="12" height="12" rx="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" begin=".8s" repeatCount="indefinite"/></rect>
      <rect x="650" y="106" width="12" height="12" rx="3"><animate attributeName="opacity" values=".2;.9;.2" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></rect>
      <rect x="830" y="142" width="12" height="12" rx="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.5s" begin="1.5s" repeatCount="indefinite"/></rect>
      <rect x="974" y="88" width="12" height="12" rx="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.7s" begin="1.9s" repeatCount="indefinite"/></rect>
    </g>

    <path d="M-40 154 C90 86 160 220 278 142 S470 72 574 140 S770 210 888 120 S1000 80 1140 145"
          fill="none" stroke="url(#line)" stroke-width="2.2" opacity=".18" filter="url(#soft)"/>
    <path d="M-40 154 C90 86 160 220 278 142 S470 72 574 140 S770 210 888 120 S1000 80 1140 145"
          fill="none" stroke="url(#line)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="9 16">
      <animate attributeName="stroke-dashoffset" from="0" to="-125" dur="5s" repeatCount="indefinite"/>
    </path>

    <g filter="url(#glow)">
      <circle r="5.5" fill="#ffffff">
        <animateMotion dur="5s" repeatCount="indefinite" path="M-40 154 C90 86 160 220 278 142 S470 72 574 140 S770 210 888 120 S1000 80 1140 145"/>
      </circle>
    </g>
    <circle r="2" fill="#ffffff">
      <animateMotion dur="5s" repeatCount="indefinite" path="M-40 154 C90 86 160 220 278 142 S470 72 574 140 S770 210 888 120 S1000 80 1140 145"/>
    </circle>
  </g>

  <g transform="translate(38 218)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="1024" height="24" rx="8" fill="#0a101c" stroke="#1c2940"/>
    <circle cx="14" cy="12" r="4" fill="#6ee7ff"/>
    <text x="28" y="16" fill="#8d9bb5" font-size="10">BUILD</text>
    <circle cx="84" cy="12" r="4" fill="#8b7cff"/>
    <text x="98" y="16" fill="#8d9bb5" font-size="10">LEARN</text>
    <circle cx="168" cy="12" r="4" fill="#ff6bd6"/>
    <text x="182" y="16" fill="#8d9bb5" font-size="10">SHIP</text>
    <text x="1008" y="16" text-anchor="end" fill="#4f607e" font-size="10">SYSTEM ONLINE</text>
  </g>
</svg>